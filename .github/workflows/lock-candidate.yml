name: Generate uv lockfile candidate
on:
  push:
    branches:
      - fix/v2-adversary-freshness
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - run: uv lock --check
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock-candidate
          path: uv.lock
          if-no-files-found: error
