name: Python, Foundry and Anvil tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra test pytest -q
  foundry-and-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - uses: astral-sh/setup-uv@v6
      - name: Solidity compilation and tests
        run: cd contracts && forge test -vv
      - name: Start isolated local chain
        run: |
          anvil --chain-id 31337 --port 8545 > /tmp/pabla-anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent -X POST -H 'Content-Type: application/json' \
                --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                http://127.0.0.1:8545 | grep -q '0x7a69'; then break; fi
            sleep 1
          done
          curl --fail --silent -X POST -H 'Content-Type: application/json' \
                --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                http://127.0.0.1:8545 | grep -q '0x7a69'
      - name: Live contract and E1-E7 integration
        run: |
          uv sync --extra chain --extra test
          uv run python scripts/deploy_contract.py
          export PABLA_CONTRACT=$(python -c 'import json;print(json.load(open("contract-deployment.json"))["address"])')
          uv run python Main.py --backend anvil --require-chain --trials 1 --events 12 --batch-size 6
  v2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra test python -m pytest -q tests/v2
      - run: uv run --extra test python Main.py --v2 --events 16
