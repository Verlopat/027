[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pabla-research"
version = "0.1.0"
description = "Verifiable provenance and continuity for batched security telemetry"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography>=45,<47", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pandas>=2.2,<3"
]

[project.optional-dependencies]
chain = ["web3>=7.9,<8"]
parquet = ["pyarrow>=18,<24"]
test = ["pytest>=8,<10", "hypothesis>=6", "pytest-cov>=5", "mutmut>=3"]
analysis = ["pyarrow>=18,<24", "pyyaml>=6", "pydantic>=2"]
native = ["coincurve>=20", "pycryptodome>=3.20"]

[tool.hatch.build.targets.wheel]
packages = ["pabla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pabla.v2"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.mutmut]
paths_to_mutate = ["pabla/v2/verifier.py", "pabla/v2/witness.py", "pabla/v2/evidence.py", "pabla/v2/tree.py"]
tests_dir = ["tests/v2/"]
